name: Build All Platforms

on:
  workflow_dispatch:
  push:
    branches: [ "master", "support/4.5+" ]
  pull_request:
    branches: [ "master", "support/4.5+" ]

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            scons_args: ""
          
          - os: windows-latest
            platform: windows
            arch: x86_64
            scons_args: "tools=msvc"
          
          - os: macos-latest
            platform: macos
            arch: arm64
            scons_args: "CXX=clang++ CC=clang macos_arch=arm64"

          - os: macos-latest
            platform: macos
            arch: x86_64
            scons_args: "CXX=clang++ CC=clang macos_arch=x86_64"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # --- SETUP DEPENDENCIES ---
    - name: Install SCons & Python
      run: pip install scons

    # Linux-specific dependencies
    - name: Install Linux Deps
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    # --- BUILD LSP FRAMEWORK ---
    
    # Linux: Build into build_linux
    - name: Build Framework (Linux)
      if: matrix.platform == 'linux'
      run: |
        cd extern/lsp-framework
        cmake -B build_linux -DCMAKE_BUILD_TYPE=Release
        cmake --build build_linux

    # macOS: Build into build_macos ( targeting matrix.arch )
    - name: Build Framework (macOS)
      if: matrix.platform == 'macos'
      run: |
        cd extern/lsp-framework
        cmake -B build_macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
        cmake --build build_macos

    # Windows: Build into build_windows (Using MinGW/MSVC generator)
    - name: Build Framework (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        cd extern/lsp-framework
        cmake -B build_windows -DCMAKE_BUILD_TYPE=Release
        cmake --build build_windows --config Release

    # --- BUILD PROJECT ---
    - name: Build GDShader LSP
      run: |
        scons platform=${{ matrix.platform }} target=release ${{ matrix.scons_args }}

    # --- UPLOAD BINARIES FOR DOWNLOAD ---
    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gdshader_lsp-${{ matrix.platform }}-${{ matrix.arch }}
        path: bin/