name: Build & Test

# Trigger on push to main/maintenance branches and every Pull Request
on:
  push:
    branches: [ "main", "support/4.5" ]
  pull_request:
    branches: [ "main", "support/4.5" ]

jobs:
  build-and-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code (Recursive is needed for lsp-framework submodule)
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Install Build Tools
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3 python3-pip

    # 3. Install Python Tools (SCons & Pytest)
    - name: Install Python Deps
      run: |
        pip3 install scons pytest

    # 4. Build the LSP Framework (Dependency)
    # We build specifically into 'build' folder as your SConstruct expects for Linux
    - name: Build LSP Framework
      run: |
        cd extern/lsp-framework
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build

    # 5. Build Your Project (GDShader LSP)
    - name: Build GDShader LSP
      run: |
        scons platform=linux target=debug

    # 6. Run the Test Suite
    # We pass the binary path explicitly so the test fixture finds it
    - name: Run Pytest Suite
      env:
        LSP_BINARY_PATH: ./bin/linux/debug/gdshader_lsp_debug
      run: |
        pytest -v tests/
