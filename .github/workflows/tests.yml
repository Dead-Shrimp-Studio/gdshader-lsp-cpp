name: Run Tests

on:
  push:
    branches: [ "master", "support/4.5" ]
  pull_request:
    branches: [ "master", "support/4.5" ]

jobs:
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3 python3-pip
        pip3 install scons pytest

    - name: Build LSP Framework
      run: |
        cd extern/lsp-framework
        cmake -B build_linux -DCMAKE_BUILD_TYPE=Debug
        cmake --build build_linux

    - name: Build Debug Binary
      run: |
        scons platform=linux target=debug

    - name: Run Tests
      env:
        LSP_BINARY_PATH: ./bin/linux/debug/gdshader_lsp_debug_linux
      run: |
        pytest -v tests/
